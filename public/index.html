<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102a43" />
  <title>Wifey2 Superstore · Inventory</title>
  <style>
    :root { --navy:#102a43; --blue:#246bfd; --cyan:#19b5fe; --ink:#1d2939; --muted:#667085; --line:#e9edf3; --bg:#f4f7fb; --red:#d92d20; --amber:#f79009; --green:#079455; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .shell { min-height:100vh; display:grid; grid-template-columns:248px 1fr; }
    aside { position:sticky; top:0; height:100vh; padding:28px 18px; color:#fff; background:linear-gradient(155deg,#102a43,#163d61); }
    .brand { display:flex; align-items:center; gap:12px; padding:0 10px 30px; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:13px; font-weight:800; background:linear-gradient(135deg,#fff,#8edcff); color:var(--navy); box-shadow:0 8px 24px rgba(0,0,0,.18); }
    .brand strong { display:block; font-size:17px; line-height:1.05; }
    .brand span { font-size:11px; opacity:.65; letter-spacing:.08em; }
    nav { display:grid; gap:7px; }
    nav button { border:0; color:#dbeafe; background:transparent; border-radius:10px; padding:12px 14px; text-align:left; }
    nav button.active,nav button:hover { color:#fff; background:rgba(255,255,255,.12); }
    main { min-width:0; padding:26px 34px 44px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
    h1 { margin:0 0 5px; font-size:28px; letter-spacing:-.03em; }
    .subtitle { color:var(--muted); }
    .primary { border:0; border-radius:10px; padding:11px 16px; color:#fff; font-weight:700; background:var(--blue); box-shadow:0 8px 18px rgba(36,107,253,.22); }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:22px; }
    .stat { min-height:112px; padding:18px; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:0 3px 12px rgba(16,42,67,.04); }
    .stat-top { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; }
    .stat-icon { width:34px; height:34px; display:grid; place-items:center; border-radius:9px; background:#edf4ff; }
    .stat-value { margin-top:12px; font-size:27px; font-weight:800; }
    .panel { border:1px solid var(--line); border-radius:14px; background:#fff; overflow:hidden; box-shadow:0 3px 16px rgba(16,42,67,.04); }
    .toolbar { display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line); }
    .search { flex:1; position:relative; max-width:390px; }
    .search input { width:100%; padding-left:38px; }
    .search:before { content:"⌕"; position:absolute; left:13px; top:7px; font-size:22px; color:#98a2b3; }
    input,select { height:40px; border:1px solid #d0d5dd; border-radius:8px; padding:0 12px; outline:none; background:#fff; color:var(--ink); }
    input:focus,select:focus { border-color:#84adff; box-shadow:0 0 0 3px #dbe8ff; }
    .toolbar select { min-width:130px; }
    table { width:100%; border-collapse:collapse; }
    th { padding:12px 16px; color:#667085; font-size:12px; text-align:left; text-transform:uppercase; letter-spacing:.04em; background:#f9fafb; }
    td { padding:14px 16px; border-top:1px solid var(--line); font-size:14px; }
    tbody tr:hover { background:#fbfdff; }
    .sku { color:#667085; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    .category { display:inline-block; padding:4px 8px; border-radius:20px; font-size:12px; background:#eff4ff; color:#3538cd; }
    .stock { font-weight:700; }
    .stock.low { color:var(--red); }
    .status { display:inline-flex; align-items:center; gap:6px; font-size:12px; }
    .status:before { content:""; width:7px; height:7px; border-radius:50%; background:#12b76a; }
    .status.out:before { background:#d92d20; }
    .actions { white-space:nowrap; }
    .icon-btn { width:32px; height:32px; margin-left:3px; border:1px solid var(--line); border-radius:7px; background:#fff; color:#475467; }
    .icon-btn.danger { color:var(--red); }
    .empty { padding:55px 20px; text-align:center; color:var(--muted); }
    .footer { display:flex; justify-content:flex-end; padding:12px 18px; color:var(--muted); font-size:13px; border-top:1px solid var(--line); }
    dialog { width:min(560px,calc(100vw - 30px)); border:0; border-radius:16px; padding:0; box-shadow:0 24px 80px rgba(16,42,67,.28); }
    dialog::backdrop { background:rgba(16,42,67,.48); backdrop-filter:blur(3px); }
    .modal-head { display:flex; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--line); }
    .modal-head h2 { margin:0; font-size:20px; }
    .close { border:0; background:none; font-size:25px; color:#667085; }
    form { padding:22px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    label { display:grid; gap:7px; color:#344054; font-size:13px; font-weight:600; }
    label.full { grid-column:1/-1; }
    form input,form select { width:100%; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
    .secondary { border:1px solid #d0d5dd; border-radius:9px; padding:10px 15px; background:#fff; }
    .toast { position:fixed; right:24px; bottom:24px; padding:13px 18px; border-radius:10px; color:#fff; background:#344054; opacity:0; transform:translateY(15px); pointer-events:none; transition:.2s; box-shadow:0 10px 30px rgba(0,0,0,.18); }
    .toast.show { opacity:1; transform:none; }
    .toast.error { background:#b42318; }
    @media(max-width:900px) { .shell { grid-template-columns:1fr; } aside { position:static; height:auto; padding:16px; } .brand { padding-bottom:14px; } nav { grid-template-columns:repeat(3,1fr); } main { padding:20px; } .stats { grid-template-columns:repeat(2,1fr); } }
    @media(max-width:650px) { main { padding:16px 12px; } header { align-items:flex-start; } header .primary { white-space:nowrap; } .stats { grid-template-columns:1fr 1fr; gap:10px; } .toolbar { flex-wrap:wrap; } .search { max-width:none; flex-basis:100%; } .panel { overflow-x:auto; } table { min-width:760px; } .form-grid { grid-template-columns:1fr; } label.full { grid-column:auto; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><div class="brand-mark">W2</div><div><strong>Wifey2</strong><span>SUPERSTORE</span></div></div>
      <nav><button class="active">▦ &nbsp; Inventory</button><button id="lowStockNav">◷ &nbsp; Low stock</button><button id="expiryNav">⌁ &nbsp; Expiry alerts</button></nav>
    </aside>
    <main>
      <header><div><h1>Inventory</h1><div class="subtitle">Manage products, stock and expiry dates.</div></div><button class="primary" id="addProduct">＋ Add product</button></header>
      <section class="stats">
        <div class="stat"><div class="stat-top"><span>Total products</span><span class="stat-icon">▦</span></div><div class="stat-value" id="totalStat">0</div></div>
        <div class="stat"><div class="stat-top"><span>Units in stock</span><span class="stat-icon">▤</span></div><div class="stat-value" id="unitsStat">0</div></div>
        <div class="stat"><div class="stat-top"><span>Low stock</span><span class="stat-icon">!</span></div><div class="stat-value" id="lowStat">0</div></div>
        <div class="stat"><div class="stat-top"><span>Expiring in 30 days</span><span class="stat-icon">⌁</span></div><div class="stat-value" id="expiryStat">0</div></div>
      </section>
      <section class="panel">
        <div class="toolbar"><div class="search"><input id="search" type="search" placeholder="Search name or SKU" /></div><select id="categoryFilter"><option value="">All categories</option></select><select id="sort"><option value="">Newest first</option><option value="name-asc">Name A–Z</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="quantity-asc">Stock: low to high</option></select></div>
        <table><thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Price</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody id="productRows"></tbody></table>
        <div id="empty" class="empty" hidden>No products found.</div><div class="footer" id="productCount"></div>
      </section>
    </main>
  </div>
  <dialog id="productDialog"><div class="modal-head"><h2 id="dialogTitle">Add product</h2><button class="close" type="button" aria-label="Close">×</button></div><form id="productForm">
    <div class="form-grid"><label>SKU<input name="sku" required /></label><label>Product name<input name="name" required /></label><label>Category<input name="category" placeholder="Electronics" /></label><label>Expiry date<input name="expiryDate" type="date" /></label><label>Quantity<input name="quantity" type="number" min="0" step="1" required /></label><label>Price<input name="price" type="number" min="0" step="0.01" required /></label><label class="full">Low-stock threshold<input name="lowStockThreshold" type="number" min="0" step="1" value="5" /></label></div>
    <div class="form-actions"><button class="secondary" type="button" id="cancelForm">Cancel</button><button class="primary" type="submit" id="saveProduct">Save product</button></div>
  </form></dialog>
  <div class="toast" id="toast"></div>
<script>
const rows = document.getElementById('productRows');
const dialog = document.getElementById('productDialog');
const form = document.getElementById('productForm');
let products = [];
let editingId = null;
let viewMode = 'all';
const currency = new Intl.NumberFormat('en-US', { style:'currency', currency:'USD' });
function toast(message, error=false) { const el=document.getElementById('toast'); el.textContent=message; el.className=`toast show${error?' error':''}`; setTimeout(()=>el.className='toast',2600); }
async function api(path, options={}) { const response=await fetch(path, options); const body=await response.json().catch(()=>({})); if(!response.ok) throw new Error(body.error?.message || `Request failed (${response.status})`); return body.data; }
async function load() { try { products=await api('/api/products?limit=100'); render(); } catch(error) { toast(error.message,true); } }
function expiresSoon(product) { if(!product.expiryDate) return false; const expiry=new Date(`${product.expiryDate}T00:00:00`), now=new Date(), end=new Date(now.getTime()+30*864e5); return expiry>=now && expiry<=end; }
function render() {
  const search=document.getElementById('search').value.trim().toLowerCase();
  const category=document.getElementById('categoryFilter').value;
  let shown=products.filter(p => (!search || `${p.name} ${p.sku}`.toLowerCase().includes(search)) && (!category || p.category===category));
  if(viewMode==='low') shown=shown.filter(p=>p.quantity<= (p.lowStockThreshold ?? 5));
  if(viewMode==='expiry') shown=shown.filter(expiresSoon);
  const sort=document.getElementById('sort').value;
  if(sort==='name-asc') shown.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort==='price-asc'||sort==='price-desc') shown.sort((a,b)=>sort==='price-asc'?a.price-b.price:b.price-a.price);
  if(sort==='quantity-asc') shown.sort((a,b)=>a.quantity-b.quantity);
  rows.innerHTML=shown.map(p=>`<tr><td><strong>${escapeHtml(p.name)}</strong><br><span class="sku">${escapeHtml(p.sku)}</span></td><td><span class="category">${escapeHtml(p.category||'Uncategorized')}</span></td><td><span class="stock ${p.quantity<= (p.lowStockThreshold ?? 5)?'low':''}">${p.quantity}</span></td><td>${currency.format(p.price)}</td><td>${p.expiryDate||'—'}</td><td><span class="status ${p.quantity===0?'out':''}">${p.quantity===0?'Out of stock':'In stock'}</span></td><td class="actions"><button class="icon-btn" data-edit="${p.id}" title="Edit">✎</button><button class="icon-btn danger" data-delete="${p.id}" title="Delete">⌫</button></td></tr>`).join('');
  document.getElementById('empty').hidden=shown.length!==0; document.querySelector('table').hidden=shown.length===0;
  document.getElementById('productCount').textContent=`${shown.length} of ${products.length} products`;
  const categories=[...new Set(products.map(p=>p.category||'Uncategorized'))].sort(); const select=document.getElementById('categoryFilter'); const current=select.value; select.innerHTML='<option value="">All categories</option>'+categories.map(c=>`<option>${escapeHtml(c)}</option>`).join(''); select.value=categories.includes(current)?current:'';
  document.getElementById('totalStat').textContent=products.length;
  document.getElementById('unitsStat').textContent=products.reduce((sum,p)=>sum+Number(p.quantity||0),0);
  document.getElementById('lowStat').textContent=products.filter(p=>p.quantity<= (p.lowStockThreshold ?? 5)).length;
  document.getElementById('expiryStat').textContent=products.filter(expiresSoon).length;
}
function escapeHtml(value){ return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function openProduct(product=null) { editingId=product?.id ?? null; document.getElementById('dialogTitle').textContent=product?'Edit product':'Add product'; form.reset(); if(product) Object.keys(product).forEach(key=>{if(form.elements[key]) form.elements[key].value=product[key] ?? ''}); if(!product) form.elements.lowStockThreshold.value=5; dialog.showModal(); }
document.getElementById('addProduct').addEventListener('click',()=>openProduct());
document.querySelector('.close').addEventListener('click',()=>dialog.close()); document.getElementById('cancelForm').addEventListener('click',()=>dialog.close());
document.getElementById('search').addEventListener('input',render); document.getElementById('categoryFilter').addEventListener('change',render); document.getElementById('sort').addEventListener('change',render);
rows.addEventListener('click',async e=>{ const edit=e.target.dataset.edit, remove=e.target.dataset.delete; if(edit) openProduct(products.find(p=>p.id===Number(edit))); if(remove && confirm('Delete this product?')) { try { await api(`/api/products/${remove}`,{method:'DELETE'}); toast('Product deleted'); await load(); } catch(error){toast(error.message,true);} }});
form.addEventListener('submit',async e=>{ e.preventDefault(); const data=Object.fromEntries(new FormData(form)); data.quantity=Number(data.quantity); data.price=Number(data.price); data.lowStockThreshold=Number(data.lowStockThreshold||5); Object.keys(data).forEach(k=>{if(typeof data[k]==='string') data[k]=data[k].trim();}); if(!data.category) delete data.category; if(!data.expiryDate) delete data.expiryDate; try { await api(editingId?`/api/products/${editingId}`:'/api/products',{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); dialog.close(); toast(editingId?'Product updated':'Product added'); await load(); } catch(error){toast(error.message,true);} });
document.getElementById('lowStockNav').addEventListener('click',()=>{viewMode=viewMode==='low'?'all':'low';render();}); document.getElementById('expiryNav').addEventListener('click',()=>{viewMode=viewMode==='expiry'?'all':'expiry';render();});
load();
</script>
</body>
</html>
